# No top-level `name:` on purpose. It would set the compose project name, and
# the project name is what the default network is called (<project>_default).
# Pinning it here risks landing in a different network than the rest of the
# stack. Let the platform decide.
#
# No networks and no extra_hosts either: CouchDB is reached by its public
# URL, the same one the LiveSync plugin uses, so there is nothing to declare
# and nothing that can drift when the platform recreates a network.

services:
  # Renders livesync-bridge's config.json from the environment, then exits.
  # The bridge reads credentials only from that file and has no environment
  # support, so writing it by hand would leave the CouchDB password and the
  # vault E2EE passphrase in plaintext on the host.
  #
  # It also mounts the vault, which it never writes to. That is deliberate:
  # its entrypoint runs as root and takes ownership of the vault for
  # PUID:PGID, and running before the bridge means the vault is already
  # writable by the time the bridge needs it.
  init:
    build: .
    image: vault-service:0.1.0
    env_file: .env
    command: ["node", "dist/cli/render-bridge-config.js", "/render/config.json"]
    volumes:
      - bridge_dat:/render
      - ${VAULT_HOST_PATH:-vault_data}:/vault
    # Shares vault-service's image, which carries an HTTP healthcheck. There
    # is no server here, so it would report unhealthy for its whole life.
    healthcheck:
      disable: true
    restart: "no"

  # Bridges your LiveSync CouchDB to a plain directory. It owns all
  # encryption, path obfuscation, chunking and conflict resolution, so
  # vault-service only ever sees ordinary markdown files.
  livesync-bridge:
    build: https://github.com/vrtmrz/livesync-bridge.git
    # Pin this once you are happy with it, e.g.
    #   build: https://github.com/vrtmrz/livesync-bridge.git#<commit-sha>
    volumes:
      # Rendered by bridge-config above, never written by hand.
      - bridge_dat:/app/dat:ro
      - ${VAULT_HOST_PATH:-vault_data}:/app/data/vault
      - bridge_state:/deno-dir/location_data
    # The bridge exposes no HTTP surface, so health is asserted from its two
    # preconditions, both of which have failed in practice:
    #
    #   1. a rendered config exists and is non-empty, otherwise the bridge
    #      starts, finds nothing and quietly syncs nothing, which from the
    #      outside is indistinguishable from working;
    #   2. the vault is present AND writable by the uid the bridge runs as,
    #      which is what the root-owned volume broke.
    #
    # Deliberately not asserting that files have appeared in the vault. On a
    # fresh or empty sync scope there is legitimately nothing to write, so
    # that would deadlock the stack rather than gate it.
    healthcheck:
      test:
        ["CMD-SHELL", "test -s /app/dat/config.json && test -w /app/data/vault"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    depends_on:
      init:
        # restart: true means a re-run of init, which happens on every
        # redeploy, also restarts this service so it picks up the new config.
        condition: service_completed_successfully
        restart: true
        required: true

  vault-service:
    build: .
    image: vault-service:0.1.0
    env_file: .env
    volumes:
      - ${VAULT_HOST_PATH:-vault_data}:/vault
      # Non-secret behaviour: the JQL, where notes live, schedules. Edit the
      # file on the host and the service picks it up within configPollMs, no
      # redeploy and no restart. Absolute, because a platform like Coolify
      # runs compose from a throwaway build directory where a relative source
      # would resolve to a path that does not exist on the host, and because
      # the repo checkout is replaced on every deploy.
      - ${CONFIG_DIR:-/data/vault-service/config}:/config:ro
    # Auth is a single access key, so do not expose this publicly. Bound to
    # loopback; put a TLS terminator in front if you need remote access.
    #
    # HOST_PORT is the only one you normally change: it must be free on the
    # host. PORT is inside the container, where nothing else competes. Both
    # come from .env so this mapping and the app cannot disagree.
    ports:
      - "127.0.0.1:${HOST_PORT:-8181}:${PORT:-8080}"
    # This service's healthcheck is defined in the Dockerfile, so it applies
    # to `docker run` and to any platform too, not only to compose. It polls
    # /health on $PORT inside the container. Deliberately not duplicated here,
    # since two definitions would drift.
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
        restart: true
        required: true
      # service_healthy, not service_started. A started bridge is not a
      # working one: it may have no config, or no write access to the vault
      # this service also depends on. restart: true means that if the bridge
      # is restarted or goes unhealthy and is replaced, this service is
      # restarted behind it rather than left running against a vault nobody
      # is replicating.
      livesync-bridge:
        condition: service_healthy
        restart: true
        required: true

volumes:
  # Holds the bridge config rendered by bridge-config, mode 600 and
  # root-owned, rebuilt from the environment on every start.
  #
  # Deliberately a normal volume, not tmpfs. A local-driver volume with
  # type=tmpfs is mounted into each container's own namespace, so what the
  # renderer writes is invisible to the bridge and vanishes when the renderer
  # exits. The environment stays the source of truth; only this derived file
  # touches disk, and never anywhere you would commit or back up.
  bridge_dat:
  bridge_state:
  # Only used while VAULT_HOST_PATH is unset. Setting it to an absolute path
  # turns the vault mounts into bind mounts instead, which is worth doing if
  # you want the plain markdown somewhere you can inspect.
  vault_data:
